name: avamovil
description: AVA Montajes - AVA MOVIL

publish_to: 'none'

version: 1.7.3

environment:
  sdk: '>=2.18.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  camera: ^0.12.0+1
  http: ^1.2.1
  provider: ^6.0.5
  path_provider: ^2.0.11
  sqflite: ^2.2.3
  flutter_svg: ^2.0.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  collection: ^1.19.0
  
  carousel_slider: ^5.0.0
  
  # Paquete de íconos
  font_awesome_flutter: ^11.0.0
  
  # Paquete de animaciones 
  animate_do: ^4.0.0 
  # Paquete para añadir una imagen transparente en caso de que la firma no cargue
  transparent_image: ^2.0.0
  
  # Paquete para visualizar pdfs
  syncfusion_flutter_pdfviewer: ^33.1.47
  
  # Paquete que contiene el widget de la firma
  syncfusion_flutter_signaturepad: ^33.1.47

  
  # ver si teclado escondido
  flutter_keyboard_visibility: ^6.0.0
  
  # foto evidencia
  image_picker: any
  # vista pdf de formularios
  pdfx: ^2.8.0
  
  pdf: ^3.11.1
  html_to_pdf: ^0.8.1
  
  # bcrypt para contraseña
  bcrypt: ^1.1.3
  # para sincro en background
  flutter_background_service: ^5.0.5  
  flutter_local_notifications: ^21.0.0
  # inactividad
  idle_detector_wrapper: ^1.0.0
  #responsive
  responsive_sizer: ^3.3.1
  
  path: ^1.9.0
  # validar rut
  validate_rut: ^0.4.0
  # version app
  package_info_plus: ^9.0.0
  # revisar permisos
  permission_handler: ^12.0.0+1
  # revisar conexion a internet
  connectivity_plus: ^7.0.0
  #udid
  flutter_udid: ^4.0.0
  geolocator: ^14.0.0
  url_launcher: ^6.3.1
  
  # actualizar app
  dio: ^5.5.0+1
  # apk_installer: ^0.0.4
  intl: ^0.20.2

  flutter_dotenv: ^6.0.0

  shared_preferences: ^2.3.1
  overlay_support: ^2.1.0

  ### widget diseño ###
  # boton con loading
  rounded_loading_button_plus: ^3.0.1
  # gap, espacio entre elementos vertical/horizontal
  gap: ^3.0.1
  # toasts
  fluttertoast: ^9.0.0
  # iconos bonitos
  line_icons: ^2.0.3
  # navbar, similar a google
  google_nav_bar: ^5.0.6
  # drop down desde abajo
  drop_down_list: ^2.0.0
  # navbar cupertino, con buscador
  super_cupertino_navigation_bar: ^2.1.2
  cupertino_modal_sheet: ^1.1.0

  toastification: ^3.0.2
  flutter_floating_bottom_bar: ^1.2.1+1
  smooth_page_indicator: ^2.0.1

  flutter_cache_manager: ^3.4.1
  # leer qr
  mobile_scanner: ^7.1.3
  uuid: ^4.5.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  logger: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.0.6
  
  
# Para que funcione el splash, correr:
#   1) flutter clean
#   2) flutter pub get
#   3) flutter pub run flutter_native_splash:create  
# La línea de comando queda como:
#   flutter clean && flutter pub get && flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#000000" 
  image: assets/logos/blanco.png 
  android: true
  ios: true
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/blanco-original.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
    
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
        
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/backgrounds/
    - .env
